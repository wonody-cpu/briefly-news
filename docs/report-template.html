<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Briefly 개발 보고서</title>
  <style>
    @page { size: A4; margin: 18mm 17mm 20mm; }
    * { box-sizing: border-box; }
    html { background: white; color-scheme: light; }
    body { max-width: 820px; margin: 0 auto; background: white; color: #20231d; font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 14px; line-height: 1.75; }
    h1 { margin: 0 0 8px; font-size: 29px; line-height: 1.35; letter-spacing: -.04em; }
    h2 { margin: 38px 0 14px; padding-bottom: 8px; border-bottom: 2px solid #20231d; font-size: 21px; letter-spacing: -.03em; break-after: avoid; }
    h3 { margin: 25px 0 9px; color: #46562e; font-size: 16px; break-after: avoid; }
    p { margin: 8px 0 12px; }
    ul, ol { margin: 8px 0 14px; padding-left: 23px; }
    li { margin: 3px 0; }
    a { color: #38510d; overflow-wrap: anywhere; }
    table { width: 100%; margin: 15px 0 20px; border-collapse: collapse; font-size: 12px; break-inside: avoid; }
    th, td { padding: 8px 10px; border: 1px solid #d7d8d1; text-align: left; vertical-align: top; }
    th { background: #eef1df; }
    img { display: block; max-width: 100%; max-height: 225mm; margin: 15px auto 20px; border: 1px solid #dddcd5; object-fit: contain; break-inside: avoid; }
    hr { margin: 28px 0; border: 0; border-top: 1px solid #d7d8d1; }
    code { padding: 1px 4px; border-radius: 3px; background: #f0f1eb; font-family: monospace; font-size: .92em; }
    strong { font-weight: 700; }
    @media print {
      html, body { background: white !important; color: #20231d !important; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      h1, h2, h3 { break-after: avoid-page; }
      table, img { break-inside: avoid-page; }
      a { color: inherit; text-decoration: none; }
    }
  </style>
</head>
<body>

</body>
</html>
